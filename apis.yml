aid: imdex

name: IMDEX

description: 'IMDEX Limited (ASX: IMD) is an Australian mining-technology company that creates drilling, sensor and software
  solutions to help resource companies find, define and mine orebodies faster, safer and more sustainably through trusted
  data and innovation. Its products include downhole survey and orientation instruments, drilling optimisation products and
  the IMDEXHUB-IQ cloud data platform, which issues API keys for third-party integrations such as Seequent Central. IMDEX
  was surfaced via the API Evangelist harvest backlog (australia-apidays-2026).'

